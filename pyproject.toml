[project]
name = "openmandel"
version = "0.1.0"
description = "MCP server that gives AI assistants deterministic Mandelbrot image-generation tools"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]",
    "numpy",
    "pillow",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
openmandel = "openmandel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
