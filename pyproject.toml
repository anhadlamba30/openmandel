[project]
name = "openmandel"
version = "0.1.1"
description = "MCP server that gives AI assistants deterministic Mandelbrot image-generation tools"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Anhad Lamba", email = "anhadlamba30@users.noreply.github.com" },
]
keywords = ["mandelbrot", "fractal", "mcp", "image-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp[cli]",
    "numpy",
    "pillow",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/anhadlamba30/openmandel"
Repository = "https://github.com/anhadlamba30/openmandel"
Issues = "https://github.com/anhadlamba30/openmandel/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
openmandel = "openmandel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
